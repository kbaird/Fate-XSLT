name: xspec
on:
  push:

permissions:
  checks: write
  contents: read

jobs:
  xspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install XSpec and Saxon
        run: |
          mkdir -p tools
          curl -fsSLo tools/xspec.tgz \
            https://github.com/xspec/xspec/archive/refs/tags/v4.0.3.tar.gz
          tar -xzf tools/xspec.tgz -C tools
          mv tools/xspec-4.0.3 tools/xspec
          chmod +x tools/xspec/bin/xspec.sh
          curl -fsSLo tools/Saxon-HE.jar \
            https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -fsSLo tools/xmlresolver.jar \
            https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/6.1.0/xmlresolver-6.1.0.jar

      - name: Run XSpec tests
        env:
          SAXON_CP: ${{ github.workspace }}/tools/Saxon-HE.jar:${{ github.workspace }}/tools/xmlresolver.jar
        run: |
          set -e
          for f in tests/xspec/*.xspec; do
            tools/xspec/bin/xspec.sh -j -c -e "$f"
          done

      - name: Generate JUnit reports
        env:
          SAXON_CP: ${{ github.workspace }}/tools/Saxon-HE.jar:${{ github.workspace }}/tools/xmlresolver.jar
        run: |
          set -e
          for f in tests/xspec/xspec/*-result.xml; do
            name=$(basename "$f" -result.xml)
            java -cp "$SAXON_CP" net.sf.saxon.Transform \
              -s:"$f" -xsl:"${{ github.workspace }}/tools/xspec/src/reporter/junit-report.xsl" \
              -o:"tests/xspec/xspec/${name}-junit.xml"
          done

      - name: Upload XSpec coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: xspec-coverage
          path: tests/xspec/xspec/*-coverage.*
          if-no-files-found: error

      - name: Report XSpec results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: XSpec Tests
          path: tests/xspec/xspec/*-junit.xml
          reporter: java-junit
          fail-on-error: 'true'
